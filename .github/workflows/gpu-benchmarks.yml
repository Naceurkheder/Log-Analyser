name: GPU benchmarks (manual)

# CUDA tests do NOT run in ci.yml: that workflow is CPU-only by design.
# This one must be dispatched on a self-hosted runner labelled `cuda` with
# CUDA 12.4, a compatible host compiler and an sm_86-class GPU.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why is a GPU benchmark run needed?
        required: false
        default: manual verification

permissions:
  contents: read

jobs:
  cuda:
    runs-on: [self-hosted, linux, cuda]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Show GPU
        run: nvidia-smi

      - name: CUDA kernel smoke and parity tests
        run: make test-cuda

      - name: Bounded VRAM / staging pipeline benchmark
        run: make cuda-memory-pipeline

      - name: Upload local benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-benchmark-output
          path: |
            results/
            build/cmake-cuda/
          if-no-files-found: warn
