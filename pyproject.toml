[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-gpu"
version = "0.3.0"
description = "Distributed CPU/CUDA log anomaly detection (academic project)"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34",
  "fastapi>=0.110",
  "pydantic>=2.7",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "moto[dynamodb,s3,sqs]>=5"]

[project.scripts]
sentinelctl = "sentinel.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
